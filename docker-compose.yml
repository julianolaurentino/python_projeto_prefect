services:

  # ─────────────────────────────────────────
  # Orquestração — Prefect Server (UI + API)
  # ─────────────────────────────────────────
  prefect-server:
    image: prefecthq/prefect:3-latest
    container_name: aic_prefect_server
    command: prefect server start --host 0.0.0.0
    ports:
      - "4200:4200"
    volumes:
      - prefect_data:/root/.prefect
    networks:
      - aic_network
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health').read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # Orquestração — Prefect Worker
  # Executa o pipeline completo: Extract → Load → dbt run → dbt test
  # ─────────────────────────────────────────
  prefect-worker:
    build:
      context: .
      dockerfile: pipelines/Dockerfile
    container_name: aic_prefect_worker
    env_file: .env
    environment:
      - PREFECT_API_URL=http://prefect-server:4200/api
      - DUCKDB_PATH=/app/data/warehouse/aic.duckdb
      - BRONZE_PATH=/app/data/bronze
      - DBT_PROJECT_DIR=/app/dbt
    volumes:
      - ./data:/app/data
      - ./pipelines:/app/pipelines
      - ./src:/app/src
      - ./dbt:/app/dbt
    networks:
      - aic_network
    depends_on:
      prefect-server:
        condition: service_healthy
    command: >
      sh -c "
        prefect work-pool create aic-pool --type process --overwrite &&
        python -m pipelines.flows.main_flow
      "

volumes:
  prefect_data:

networks:
  aic_network:
    driver: bridge